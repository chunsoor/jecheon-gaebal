<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="개발행위 1차판단">
<title>개발행위 1차 판단 · 제천시</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>
<script src="rules.js?v=20261016-1637"></script>
<style>
  :root {
    --bg: #f2f4f6; --card: #ffffff; --text: #191f28; --sub: #6b7684; --line: #eef0f2;
    --blue: #3182f6; --blue-weak: #e8f3ff;
    --ok-weak: #e3f6ea; --cond-weak: #fff4cc; --ck-weak: #ffe8d9; --ng-weak: #fde2e1; --na-weak: #eef1f4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 14px; line-height: 1.5; -webkit-text-size-adjust: 100%; word-break: keep-all; overflow-wrap: anywhere; }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 12px 16px; }
  .top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 2px 0 10px; }
  h1 { font-size: 20px; margin: 0; font-weight: 700; }
  .lead { color: var(--sub); font-size: 13px; }
  .card { background: var(--card); border-radius: 16px; padding: 14px 16px; }
  .card h2 { font-size: 15px; margin: 0 0 8px; font-weight: 700; }
  label.f { display: block; font-size: 12px; color: var(--sub); margin-bottom: 3px; white-space: nowrap; }
  input, select, button { font: inherit; }
  input[type=text], input[type=number], input[type=date], input[type=password], select {
    width: 100%; padding: 9px 10px; border: 1px solid #d1d6db; border-radius: 10px; background: #fff; color: var(--text); font-size: 16px; min-height: 42px; }
  input[type=date] { -webkit-appearance: none; appearance: none; }
  select:disabled { background: #f2f4f6; color: var(--sub); opacity: 1; }
  .row { display: flex; gap: 8px; align-items: center; }
  .chk { display: flex; gap: 4px; align-items: center; white-space: nowrap; font-size: 15px; }
  .btn { background: var(--blue); color: #fff; border: 0; border-radius: 10px; padding: 0 20px; min-height: 42px; font-weight: 700; cursor: pointer; font-size: 16px; white-space: nowrap; }
  .btn:disabled { opacity: .5; }
  .hint { color: var(--sub); font-size: 12.5px; margin-top: 6px; }
  /* 입력: 넓은 화면은 한 줄 */
  .inrow { display: grid; gap: 10px; grid-template-columns: 124px 120px 190px minmax(140px, 1fr) minmax(200px, 1.6fr) auto; align-items: end; }
  .fixed { min-height: 42px; display: flex; align-items: center; font-weight: 700; }
  .opts { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-top: 10px; }
  @media (max-width: 1100px) { .inrow { grid-template-columns: repeat(4, minmax(0, 1fr)); } .inrow .wide { grid-column: span 2; } .inrow .wide2 { grid-column: span 1; } .inrow .bj { grid-column: span 2; } }
  @media (max-width: 600px) { .inrow { grid-template-columns: 1fr 1fr; } .inrow .wide, .inrow .wide2, .inrow .bj { grid-column: 1 / -1; } }
  /* 결과: 지도 + 카드 3열 */
  .verdict { border-radius: 16px; padding: 14px 18px; margin: 12px 0; display: flex; gap: 6px 18px; align-items: baseline; flex-wrap: wrap; }
  .verdict .big { font-size: 24px; font-weight: 800; white-space: nowrap; }
  .verdict .lab { font-size: 13px; font-weight: 700; opacity: .85; width: 100%; }
  .verdict .why { font-size: 15px; flex: 1; min-width: 240px; }
  /* 세 줄기(열)마다 카드를 위에서부터 붙여 쌓아 빈칸이 생기지 않게 함 */
  .board { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }
  .col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .col > .card { min-width: 0; }
  .mapcard { padding: 8px; position: relative; z-index: 0; isolation: isolate; }
  #map { position: relative; z-index: 0; }
  #map { height: 420px; border-radius: 12px; background: #dfe3e8; }
  @media (max-width: 760px) { .board { display: flex; flex-direction: column; } .col { display: contents; } #map { height: 340px; }
    .o1 { order: 1; } .o2 { order: 2; } .o3 { order: 3; } .o4 { order: 4; } .o5 { order: 5; } .o6 { order: 6; } }
  .legend { display: flex; gap: 4px 12px; flex-wrap: wrap; font-size: 12px; color: var(--sub); margin: 6px 4px 2px; }
  .sw { display: inline-block; width: 13px; height: 9px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
  .s-OK { background: var(--ok-weak); color: #0b5d2e; } .s-COND { background: var(--cond-weak); color: #7a4d00; }
  .s-CK { background: var(--ck-weak); color: #8a2c00; } .s-NG { background: var(--ng-weak); color: #9b1c1f; } .s-NA { background: var(--na-weak); color: #4e5968; }
  .s-SPLIT { background: var(--blue-weak); color: #1b4ea8; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; flex: none; }
  .step { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .step:last-child { border-bottom: 0; }
  .step .sh { display: flex; gap: 6px; align-items: center; margin-bottom: 2px; }
  .step .sh b { font-size: 14px; }
  .basis { color: var(--sub); font-size: 12px; margin-top: 2px; }
  .kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; }
  .kv .k { color: var(--sub); white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; background: #f2f4f6; }
  .chip.z { background: var(--blue-weak); color: #1b4ea8; font-weight: 700; }
  .warn { border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; }
  .w-red { background: var(--ng-weak); } .w-yel { background: var(--cond-weak); } .w-gray { background: #f2f4f6; }
  .warn b { display: block; }
  .three { display: grid; gap: 6px; margin-top: 8px; }
  .three > div { border-radius: 10px; padding: 8px 10px; }
  .three .h { font-weight: 800; }
  .three .gh { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
  .three .gh b { font-size: 15px; }
  .three .gd { font-size: 12.5px; opacity: .8; margin: 1px 0 4px; }
  .gt { margin-top: 10px; }
  .gt-h { font-weight: 700; margin-bottom: 4px; }
  .gt table { width: 100%; border-collapse: collapse; font-size: 12.5px; table-layout: fixed; }
  .gt th:first-child { width: 40%; }
  .gt th, .gt td { padding: 6px 2px; border-bottom: 1px solid var(--line); text-align: center; }
  .gt th { color: var(--sub); font-weight: 400; font-size: 12px; white-space: nowrap; }
  .gt td:first-child, .gt th:first-child { text-align: left; overflow-wrap: normal; }
  .gt th:first-child { white-space: normal; }
  .gt tr.me td { background: var(--blue-weak); }
  .gt .ok { color: #0b5d2e; font-weight: 700; white-space: nowrap; } .gt .ng { color: #9b1c1f; font-weight: 700; white-space: nowrap; }
  .sub2 { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #d1d6db; }
  ul.field { margin: 0; padding-left: 18px; } ul.field li { margin-bottom: 4px; }
  .msg { padding: 10px 12px; border-radius: 10px; background: var(--ng-weak); color: #9b1c1f; margin-top: 10px; display: none; }
  .foot { color: var(--sub); font-size: 12px; text-align: center; margin: 16px 0 26px; }
  .hide { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>개발행위 1차 판단</h1><span class="lead">충청북도 제천시 · 민원 상담용 1차 판단</span></div>

  <div class="card hide" id="keyCard" style="margin-bottom:12px">
    <h2>브이월드 인증키</h2>
    <div class="row">
      <input id="key" type="password" placeholder="브이월드 인증키를 붙여 넣으세요 (이 기기에만 저장)">
      <button class="btn" id="saveKey">저장</button>
    </div>
    <div class="hint">처음 한 번만 넣으면 됩니다. 키는 이 기기의 브라우저에만 저장됩니다.</div>
  </div>

  <div class="card">
    <div class="inrow">
      <div class="ep"><label class="f">읍·면·동</label><select id="emd"></select></div>
      <div><label class="f">리</label><select id="ri"></select></div>
      <div class="bj"><label class="f">번지</label>
        <div class="row"><label class="chk"><input type="checkbox" id="san">산</label><input type="text" id="bunji" placeholder="예: 727-7"></div></div>
      <div class="wide2"><label class="f">하려는 일 찾기</label><input type="text" id="actSearch" placeholder="예: 카페, 주기장, 태양광"></div>
      <div class="wide"><label class="f">하려는 일</label><select id="act"></select></div>
      <div><label class="f">&nbsp;</label><button class="btn" id="run">확인하기</button></div>
    </div>
    <div id="opts"></div>
    <div class="hint" id="status"></div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="hide" id="result">
    <div class="verdict" id="verdict"></div>
    <div class="board">
      <div class="col" id="col1"><div class="card mapcard o1"><div id="map"></div><div class="legend" id="legend"></div></div></div>
      <div class="col" id="col2"></div>
      <div class="col" id="col3"></div>
    </div>
  </div>

  <div class="foot">기준: 판단규칙표·용도지역별 건축가능 건축물표(2026. 10. 13.) · 브이월드 공간정보 · 1차 판단용이며 처분 근거는 법령 원문으로 다시 확인합니다.<br><span id="ver"></span> · <a href="#" id="showKey">인증키 다시 넣기</a></div>
</div>
<script src="app.js?v=20261016-1637"></script>
</body>
</html>
