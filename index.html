<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="개발행위 1차판단">
<title>개발행위 1차 판단 · 봉양읍</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
<script src="rules.js?v=20261013-1653"></script>
<style>
  :root {
    --bg: #f2f4f6; --card: #ffffff; --text: #191f28; --sub: #6b7684; --line: #e5e8eb;
    --blue: #3182f6; --blue-weak: #e8f3ff;
    --ok: #12a150; --ok-weak: #e3f6ea; --cond: #b7791f; --cond-weak: #fff4cc;
    --ck: #d9480f; --ck-weak: #ffe8d9; --ng: #e5484d; --ng-weak: #fde2e1; --na: #4e5968; --na-weak: #eef1f4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 15px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 6px 0 2px; font-weight: 700; }
  .lead { color: var(--sub); margin: 0 0 14px; font-size: 14px; }
  .card { background: var(--card); border-radius: 18px; padding: 18px 20px; margin-bottom: 14px; }
  .card h2 { font-size: 16px; margin: 0 0 10px; font-weight: 700; }
  label.f { display: block; font-size: 13px; color: var(--sub); margin-bottom: 4px; }
  input, select, button { font: inherit; }
  input[type=text], input[type=number], input[type=date], input[type=password], select {
    width: 100%; padding: 11px 12px; border: 1px solid #d1d6db; border-radius: 12px; background: #fff; color: var(--text); font-size: 16px;
  }
  input[type=date] { -webkit-appearance: none; appearance: none; min-height: 46px; }
  .grid { display: grid; gap: 12px; }
  .g-in { grid-template-columns: 150px 160px 1fr; }
  .g-opt { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-top: 12px; }
  .fixed { padding: 11px 0; font-weight: 700; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chk { display: flex; gap: 6px; align-items: center; font-size: 15px; padding-top: 6px; }
  .btn { background: var(--blue); color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; font-weight: 700; cursor: pointer; font-size: 16px; }
  .btn:disabled { opacity: .5; }
  .btn.sub { background: var(--blue-weak); color: var(--blue); }
  .hint { color: var(--sub); font-size: 13px; margin-top: 6px; }
  .main { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 1000px) { .main { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); } .mapcol { position: sticky; top: 12px; align-self: start; } }
  @media (max-width: 640px) { .g-in { grid-template-columns: 1fr 1fr; } .g-in .actbox { grid-column: 1 / -1; } .card { padding: 16px; } }
  #map { height: 520px; border-radius: 14px; background: #dfe3e8; }
  @media (max-width: 999px) { #map { height: 380px; } }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--sub); margin-top: 8px; }
  .sw { display: inline-block; width: 14px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
  .verdict { border-radius: 18px; padding: 20px; margin-bottom: 14px; }
  .verdict .lab { font-size: 13px; font-weight: 700; opacity: .8; }
  .verdict .big { font-size: 26px; font-weight: 800; margin: 2px 0 6px; }
  .verdict .why { font-size: 15px; }
  .s-OK { background: var(--ok-weak); color: #0b5d2e; } .s-COND { background: var(--cond-weak); color: #7a4d00; }
  .s-CK { background: var(--ck-weak); color: #8a2c00; } .s-NG { background: var(--ng-weak); color: #9b1c1f; } .s-NA { background: var(--na-weak); color: var(--na); }
  .s-SPLIT { background: var(--blue-weak); color: #1b4ea8; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  table.kv { width: 100%; border-collapse: collapse; }
  table.kv td { padding: 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.kv td:first-child { width: 110px; color: var(--sub); font-size: 14px; }
  table.st { width: 100%; border-collapse: collapse; }
  table.st th { text-align: left; font-size: 13px; color: var(--sub); font-weight: 600; padding: 6px 6px 6px 0; border-bottom: 1px solid var(--line); }
  table.st td { padding: 9px 6px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 14px; }
  table.st td.k { width: 120px; font-weight: 700; }
  table.st td.t { width: 104px; }
  .basis { color: var(--sub); font-size: 12.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: #f2f4f6; }
  .chip.z { background: var(--blue-weak); color: #1b4ea8; font-weight: 700; }
  .warn { border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; font-size: 14px; }
  .w-red { background: var(--ng-weak); } .w-yel { background: var(--cond-weak); } .w-gray { background: #f2f4f6; }
  .warn b { display: block; margin-bottom: 2px; }
  .three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .three > div { border-radius: 12px; padding: 10px; font-size: 14px; }
  .three .h { font-weight: 800; margin-bottom: 4px; }
  @media (max-width: 640px) { .three { grid-template-columns: 1fr; } }
  ul.field { margin: 0; padding-left: 18px; } ul.field li { margin-bottom: 4px; }
  .msg { padding: 12px 14px; border-radius: 12px; background: var(--ng-weak); color: #9b1c1f; margin-top: 10px; display: none; }
  .foot { color: var(--sub); font-size: 12.5px; text-align: center; margin: 18px 0 30px; }
  .hide { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <h1>개발행위 1차 판단</h1>
  <p class="lead">충청북도 제천시 봉양읍 · 지번과 하려는 일을 넣으면 용도지역과 가능 여부를 한 번에 보여 드립니다. 민원 상담용 1차 판단입니다.</p>

  <div class="card hide" id="keyCard">
    <h2>브이월드 인증키</h2>
    <div class="row">
      <input id="key" type="password" placeholder="브이월드 인증키를 붙여 넣으세요 (이 기기에만 저장)" style="flex:1;min-width:220px">
      <button class="btn" id="saveKey">저장</button>
    </div>
    <div class="hint">처음 한 번만 넣으면 됩니다. 키는 이 기기의 브라우저에만 저장됩니다.</div>
  </div>

  <div class="card">
    <div class="grid g-in">
      <div><label class="f">읍</label><div class="fixed">봉양읍</div></div>
      <div><label class="f">리</label><select id="ri"></select></div>
      <div class="actbox">
        <label class="f">번지</label>
        <div class="row">
          <label class="chk" style="padding:0"><input type="checkbox" id="san"> 산</label>
          <input type="text" id="bunji" placeholder="예: 123 또는 727-7" inputmode="text" style="flex:1;min-width:120px">
        </div>
      </div>
    </div>
    <div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,2fr);margin-top:12px">
      <div><label class="f">하려는 일 찾기</label><input type="text" id="actSearch" placeholder="예: 카페, 주기장, 태양광, 성토"></div>
      <div><label class="f">하려는 일</label><select id="act"></select></div>
    </div>
    <div id="opts"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="run">확인하기</button>
      <span class="hint" id="status"></span>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="main hide" id="result">
    <div class="mapcol">
      <div class="card" style="padding:12px">
        <div id="map"></div>
        <div class="legend" id="legend"></div>
      </div>
    </div>
    <div id="out"></div>
  </div>

  <div class="foot">기준: 판단규칙표·용도지역별 건축가능 건축물표(2026. 10. 13.) · 브이월드 공간정보 · 1차 판단용이며 처분 근거는 법령 원문으로 다시 확인합니다.<br><a href="#" id="showKey">인증키 다시 넣기</a></div>
</div>
<script src="app.js?v=20261013-1653"></script>
</body>
</html>
